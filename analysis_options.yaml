# Statik analiz yapılandırması.
#
# Task 03'e kadar bu dosya stok şablondu: hiçbir kural bastırılmamıştı ama
# hiçbir ek kural da açık değildi. Aşağıdaki kurallar bilinçli olarak açıldı
# ve çıkan uyarılar BASTIRILARAK değil DÜZELTİLEREK kapatıldı; yeni bir
# ihlal CI'da kırmızı yanar.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # `dynamic` → belirli tip atamaları örtük yapılamaz; repository parse
    # kodundaki sessiz tip kaymalarını derleme anına çeker.
    strict-casts: true
    # `List` gibi çıplak jenerikler yasak; `List<dynamic>` niyetse açık yaz.
    strict-raw-types: true
  exclude:
    # Soru havuzu ve konu haritası bu sürümde arayüzden çıkarıldı ama silinmedi:
    # ileride elden geçirilip geri gelecekler (bkz. lib/_archive/README.md).
    # Hiçbir yerden çağrılmadıkları için derlemeye girmiyorlar; analizden de
    # çıkarıldılar ki eski API'lere göre yazılmış kod CI'yı kırmasın.
    - lib/_archive/**
    # Tek seferlik veri betikleri: uygulama kodu degil, kendi
    # bagimliliklari var (package:image pubspec'te yok) ve `dart run`
    # ile elle calistiriliyorlar.
    - tools/bin/**
    - build/**
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    # Sahipsiz future'lar bu depodaki en yaygın sessiz-hata kaynağıydı
    # (denetimde ~40 adet): ya `await` ya `unawaited(...)` — niyet görünür.
    unawaited_futures: true
    # Async boşluk sonrası context kullanımı (flutter_lints'te uyarı olarak
    # var; burada açıkça beyan ediliyor ki listeden çıkarsa fark edilsin).
    use_build_context_synchronously: true
    # dispose edilmeyen StreamSubscription'lar (e-posta doğrulama adımındaki
    # auth dinleyicisi gibi) sızıntı yapmasın.
    cancel_subscriptions: true
    # Error/Exception dışında bir şey fırlatmak stack trace'i çöpe atar.
    only_throw_errors: true
