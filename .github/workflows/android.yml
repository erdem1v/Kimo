# Android APK üretimi.
#
# NEDEN AYRI BİR İŞ: `ci.yml` doğrulama yapıyor (analyze, test, pgTAP). Bu
# workflow bir ÇIKTI üretiyor. Ayrı tutulmasının sebebi, APK'nın her push'ta
# değil istendiğinde derlenmesi: derleme dakikalarca sürüyor ve her commit için
# bir APK'ya ihtiyaç yok.
#
# Nasıl çalıştırılır:
#   • Elle: Actions > "android apk" > Run workflow
#   • Etiketle: `git tag v1.0.0 && git push kimo v1.0.0`
#     (etiketle çalıştığında APK bir GitHub Release'ine de yüklenir)
#
# APK NASIL İMZALANIR (Task 03'te güncellendi): `ANDROID_KEYSTORE_BASE64` ve
# `ANDROID_KEY_PROPERTIES` sırları tanımlıysa gerçek yayın anahtarıyla,
# değilse debug anahtarıyla imzalanır (yan yükleme testi için uygundur; Play
# Store'a YÜKLENEMEZ). Hangi durumun geçerli olduğu günlüğe yazılır.
# Keystore üretimi ve key.properties biçimi: android/app/build.gradle.kts
# başındaki yorum.
name: android apk

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Derleme türü"
        required: true
        default: release
        type: choice
        options: [release, debug]
      bundle:
        description: "APK yerine .aab üret (Play'e yükleme için ŞART)"
        required: false
        default: false
        type: boolean
      admob_test_ok:
        description: "Release'i Google'ın TEST AdMob kimliğiyle derlemeye İZİN VER (yalnızca imza/derleme doğrulaması; Play'e YÜKLENMEZ)"
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write   # etiketli çalıştırmada Release oluşturmak için

jobs:
  apk:
    name: APK derle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flutter'ın Android derlemesi JDK 17 istiyor; build.gradle.kts de
      # sourceCompatibility/jvmTarget olarak 17 beyan ediyor.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---------------------------------------------------------- gizli dosyalar
      # İkisi de depoda YOK (.gitignore) ve ikisi de İSTEĞE BAĞLI.
      # Sır tanımlı değilse derleme yine tamamlanır; yalnızca ilgili özellik
      # o APK'da çalışmaz. Sessiz kalmıyoruz: hangi durumun geçerli olduğu
      # günlüğe yazılıyor.
      - name: Firebase yapılandırması (varsa)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "::notice::google-services.json yazıldı — push bildirimleri etkin."
          else
            echo "::warning::GOOGLE_SERVICES_JSON sırrı yok — APK push bildirimleri OLMADAN derlenecek."
          fi

      - name: Yayın anahtarı (varsa)
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_PROPERTIES" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/kimo-release.jks
            printf '%s' "$ANDROID_KEY_PROPERTIES" > android/key.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Yayın anahtarı yazıldı — çıktı gerçek anahtarla imzalanacak."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Yayın anahtarı sırları yok — çıktı DEBUG anahtarıyla imzalanacak (Play'e yüklenemez)."
          fi

      - name: Supabase yapılandırması (varsa)
        env:
          SUPABASE_JSON: ${{ secrets.SUPABASE_JSON }}
        run: |
          if [ -n "$SUPABASE_JSON" ]; then
            printf '%s' "$SUPABASE_JSON" > supabase.json
            echo "::notice::supabase.json yazıldı — uygulama gerçek sunucuya bağlanacak."
          else
            echo "::warning::SUPABASE_JSON sırrı yok — bu çıktı YAPILANDIRMASIZ ve AÇILMAZ; eksik ayarları anlatan bir hata ekranı gösterir (lib/main.dart ConfigErrorApp). 'Demo modu' Task 03'te kaldırıldı."
          fi

      # ------------------------------------------------------------- derleme
      - run: flutter pub get

      # pubspec.lock depoya işleniyor ve pubspec.yaml ile eşzamanlı kalmalı.
      - name: pubspec.lock değişmedi mi
        run: git diff --exit-code pubspec.lock

      - name: APK derle
        env:
          # Çökme raporlama (Sentry). Sır tanımlı değilse uygulama raporsuz
          # derlenir ve çalışmaya devam eder — supabase.json ile aynı desen.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # AdMob UYGULAMA kimliği. `--dart-define` manifest'e ULAŞAMIYOR, o
          # yüzden Gradle özelliği olarak geçiyor. Sır yoksa Google'ın AÇIK
          # TEST kimliği kalıyor ve Gradle bunu derleme çıktısına yazıyor —
          # sessiz değil. Gerçek kimlik olmadan üretime çıkılırsa reklam hiç
          # gelmez (ama uygulama ÇÖKMEZ; çökme kimliğin HİÇ olmadığı durum).
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          BUILD_TYPE="${{ inputs.flavor || 'release' }}"
          ARGS=""
          if [ -f supabase.json ]; then
            ARGS="--dart-define-from-file=supabase.json"
          fi
          if [ -n "$SENTRY_DSN" ]; then
            ARGS="$ARGS --dart-define=SENTRY_DSN=$SENTRY_DSN"
            echo "::notice::SENTRY_DSN tanımlı — çökme raporlama etkin."
          else
            echo "::warning::SENTRY_DSN sırrı yok — APK çökme raporlaması OLMADAN derlenecek."
          fi
          if [ -n "$ADMOB_APP_ID" ]; then
            ARGS="$ARGS -Padmob.appId=$ADMOB_APP_ID"
            echo "::notice::ADMOB_APP_ID tanımlı — gerçek AdMob uygulama kimliği."
          elif [ "$BUILD_TYPE" = "release" ] && [ "${{ inputs.admob_test_ok }}" != "true" ]; then
            # YAYIN YAPISI TEST KİMLİĞİYLE ÇIKAMAZ (Task 18 · S2). Eskiden
            # yalnızca uyarı basılıyordu; uyarıyı kimse okumazsa mağazaya
            # giden yapı Google'ın test kimliğini taşır ve reklam geliri
            # sıfırlanır. Debug/profile yapıları test kimliğiyle sürüyor.
            echo "::error::ADMOB_APP_ID sırrı yok — RELEASE yapısı Google'ın TEST uygulama kimliğiyle DERLENMEZ. Sırrı girin ya da debug derleyin."
            exit 1
          else
            echo "::warning::ADMOB_APP_ID sırrı yok — $BUILD_TYPE yapısı Google'ın TEST uygulama kimliğiyle derlenecek, gerçek reklam gelmez. Bu yapı Play'e YÜKLENMEZ."
          fi
          # PLAY YENİ UYGULAMALAR İÇİN `.aab` ŞART KOŞUYOR. Task 13'e kadar
          # bu iş yalnızca APK üretiyordu, yani IAP'li bir sürümü Play'e
          # yüklemenin yolu YOKTU. APK yan yükleme testi için kalıyor.
          if [ "${{ inputs.bundle }}" = "true" ]; then
            echo "flutter build appbundle --$BUILD_TYPE (define'lar gizli)"
            flutter build appbundle --"$BUILD_TYPE" $ARGS
          else
            echo "flutter build apk --$BUILD_TYPE (define'lar gizli)"
            flutter build apk --"$BUILD_TYPE" $ARGS
          fi

      # Derlenen dosyanın gerçekten var olduğunu ve boyutunu doğrula: sessizce
      # boş bir çıktı yüklemek "APK hazır" demenin en kötü yolu olurdu.
      - name: Çıktıyı doğrula ve adlandır
        id: artifact
        run: |
          BUILD_TYPE="${{ inputs.flavor || 'release' }}"
          if [ "${{ inputs.bundle }}" = "true" ]; then
            SRC="build/app/outputs/bundle/${BUILD_TYPE}/app-$BUILD_TYPE.aab"
            EXT="aab"
          else
            SRC="build/app/outputs/flutter-apk/app-$BUILD_TYPE.apk"
            EXT="apk"
          fi
          test -f "$SRC" || { echo "::error::Çıktı üretilmedi: $SRC yok"; exit 1; }
          SIZE=$(stat -c%s "$SRC")
          test "$SIZE" -gt 1000000 || { echo "::error::Çıktı şüpheli derecede küçük ($SIZE bayt)"; exit 1; }
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr '+' '-')
          NAME="kimo-$VERSION-$BUILD_TYPE-${GITHUB_SHA::7}.$EXT"
          cp "$SRC" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "::notice::$NAME — $((SIZE / 1024 / 1024)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.name }}
          retention-days: 30

      # ------------------------------------------------------------- yayın
      # Yalnızca etiketle çalıştırıldığında. APK DEPOYA COMMIT EDİLMİYOR:
      # onlarca MB'lık ikili dosyalar git geçmişini kalıcı olarak şişirir ve
      # geri alınamaz. Release varlığı doğru yer.
      - name: Release oluştur ve APK'yı ekle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          # Sır DOĞRUDAN kabuk satırına gömülmüyor: `${{ secrets.X }}` bir
          # komutun içine yazıldığında değer, çalıştırılan komut satırında
          # (ve hata ayıklama izlerinde) görünür hâle gelir. Ortam değişkeni
          # olarak geçmek bu yüzeyi kapatıyor; aşağıda yalnızca "boş mu"
          # sorusu soruluyor, değerin kendisi hiç yazdırılmıyor.
          SUPABASE_JSON: ${{ secrets.SUPABASE_JSON }}
        run: |
          # NOT ARTIK KOŞULLU. Task 13'e kadar bu satır KOŞULSUZ "debug
          # anahtarıyla imzalıdır" diyordu, oysa imzalama yukarıda koşullu:
          # gerçek yayın anahtarıyla imzalanmış bir çıktı YANLIŞ notla
          # yayınlanıyordu.
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            NOTES="Bu çıktı **gerçek yayın anahtarıyla** imzalıdır."
          else
            NOTES="Bu çıktı **debug anahtarıyla** imzalıdır: yan yüklemeyle test için uygundur, mağazaya yüklenemez."
          fi
          if [ -z "$SUPABASE_JSON" ]; then
            NOTES="$NOTES"$'\n\n'"UYARI: SUPABASE_JSON sırrı tanımlı olmadığı için bu çıktı **yapılandırmasızdır ve AÇILMAZ** — eksik ayarları anlatan bir hata ekranı gösterir. ('Demo modu' Task 03'te kaldırıldı.)"
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.artifact.outputs.name }}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "$NOTES"
