# Android APK üretimi.
#
# NEDEN AYRI BİR İŞ: `ci.yml` doğrulama yapıyor (analyze, test, pgTAP). Bu
# workflow bir ÇIKTI üretiyor. Ayrı tutulmasının sebebi, APK'nın her push'ta
# değil istendiğinde derlenmesi: derleme dakikalarca sürüyor ve her commit için
# bir APK'ya ihtiyaç yok.
#
# Nasıl çalıştırılır:
#   • Elle: Actions > "android apk" > Run workflow
#   • Etiketle: `git tag v1.0.0 && git push kimo v1.0.0`
#     (etiketle çalıştığında APK bir GitHub Release'ine de yüklenir)
#
# APK NASIL İMZALANIR (Task 03'te güncellendi): `ANDROID_KEYSTORE_BASE64` ve
# `ANDROID_KEY_PROPERTIES` sırları tanımlıysa gerçek yayın anahtarıyla,
# değilse debug anahtarıyla imzalanır (yan yükleme testi için uygundur; Play
# Store'a YÜKLENEMEZ). Hangi durumun geçerli olduğu günlüğe yazılır.
# Keystore üretimi ve key.properties biçimi: android/app/build.gradle.kts
# başındaki yorum.
name: android apk

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Derleme türü"
        required: true
        default: release
        type: choice
        options: [release, debug]
  push:
    tags: ['v*']

permissions:
  contents: write   # etiketli çalıştırmada Release oluşturmak için

jobs:
  apk:
    name: APK derle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Flutter'ın Android derlemesi JDK 17 istiyor; build.gradle.kts de
      # sourceCompatibility/jvmTarget olarak 17 beyan ediyor.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---------------------------------------------------------- gizli dosyalar
      # İkisi de depoda YOK (.gitignore) ve ikisi de İSTEĞE BAĞLI.
      # Sır tanımlı değilse derleme yine tamamlanır; yalnızca ilgili özellik
      # o APK'da çalışmaz. Sessiz kalmıyoruz: hangi durumun geçerli olduğu
      # günlüğe yazılıyor.
      - name: Firebase yapılandırması (varsa)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "::notice::google-services.json yazıldı — push bildirimleri etkin."
          else
            echo "::warning::GOOGLE_SERVICES_JSON sırrı yok — APK push bildirimleri OLMADAN derlenecek."
          fi

      - name: Yayın anahtarı (varsa)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEY_PROPERTIES" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/kimo-release.jks
            printf '%s' "$ANDROID_KEY_PROPERTIES" > android/key.properties
            echo "::notice::Yayın anahtarı yazıldı — APK gerçek anahtarla imzalanacak."
          else
            echo "::warning::Yayın anahtarı sırları yok — APK DEBUG anahtarıyla imzalanacak (Play'e yüklenemez)."
          fi

      - name: Supabase yapılandırması (varsa)
        env:
          SUPABASE_JSON: ${{ secrets.SUPABASE_JSON }}
        run: |
          if [ -n "$SUPABASE_JSON" ]; then
            printf '%s' "$SUPABASE_JSON" > supabase.json
            echo "::notice::supabase.json yazıldı — uygulama gerçek sunucuya bağlanacak."
          else
            echo "::warning::SUPABASE_JSON sırrı yok — APK DEMO MODUNDA derlenecek (yerel mock veri, oturum yok)."
          fi

      # ------------------------------------------------------------- derleme
      - run: flutter pub get

      # pubspec.lock depoya işleniyor ve pubspec.yaml ile eşzamanlı kalmalı.
      - name: pubspec.lock değişmedi mi
        run: git diff --exit-code pubspec.lock

      - name: APK derle
        env:
          # Çökme raporlama (Sentry). Sır tanımlı değilse uygulama raporsuz
          # derlenir ve çalışmaya devam eder — supabase.json ile aynı desen.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          BUILD_TYPE="${{ inputs.flavor || 'release' }}"
          ARGS=""
          if [ -f supabase.json ]; then
            ARGS="--dart-define-from-file=supabase.json"
          fi
          if [ -n "$SENTRY_DSN" ]; then
            ARGS="$ARGS --dart-define=SENTRY_DSN=$SENTRY_DSN"
            echo "::notice::SENTRY_DSN tanımlı — çökme raporlama etkin."
          else
            echo "::warning::SENTRY_DSN sırrı yok — APK çökme raporlaması OLMADAN derlenecek."
          fi
          echo "flutter build apk --$BUILD_TYPE (define'lar gizli)"
          flutter build apk --"$BUILD_TYPE" $ARGS

      # Derlenen dosyanın gerçekten var olduğunu ve boyutunu doğrula: sessizce
      # boş bir çıktı yüklemek "APK hazır" demenin en kötü yolu olurdu.
      - name: Çıktıyı doğrula ve adlandır
        id: artifact
        run: |
          BUILD_TYPE="${{ inputs.flavor || 'release' }}"
          SRC="build/app/outputs/flutter-apk/app-$BUILD_TYPE.apk"
          test -f "$SRC" || { echo "::error::APK üretilmedi: $SRC yok"; exit 1; }
          SIZE=$(stat -c%s "$SRC")
          test "$SIZE" -gt 1000000 || { echo "::error::APK şüpheli derecede küçük ($SIZE bayt)"; exit 1; }
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | tr '+' '-')
          NAME="kimo-$VERSION-$BUILD_TYPE-${GITHUB_SHA::7}.apk"
          cp "$SRC" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "::notice::$NAME — $((SIZE / 1024 / 1024)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ steps.artifact.outputs.name }}
          retention-days: 30

      # ------------------------------------------------------------- yayın
      # Yalnızca etiketle çalıştırıldığında. APK DEPOYA COMMIT EDİLMİYOR:
      # onlarca MB'lık ikili dosyalar git geçmişini kalıcı olarak şişirir ve
      # geri alınamaz. Release varlığı doğru yer.
      - name: Release oluştur ve APK'yı ekle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          # Sır DOĞRUDAN kabuk satırına gömülmüyor: `${{ secrets.X }}` bir
          # komutun içine yazıldığında değer, çalıştırılan komut satırında
          # (ve hata ayıklama izlerinde) görünür hâle gelir. Ortam değişkeni
          # olarak geçmek bu yüzeyi kapatıyor; aşağıda yalnızca "boş mu"
          # sorusu soruluyor, değerin kendisi hiç yazdırılmıyor.
          SUPABASE_JSON: ${{ secrets.SUPABASE_JSON }}
        run: |
          NOTES="Bu APK **debug anahtarıyla** imzalıdır: yan yüklemeyle test için uygundur, Play Store'a yüklenemez."
          if [ -z "$SUPABASE_JSON" ]; then
            NOTES="$NOTES"$'\n\n'"UYARI: SUPABASE_JSON sırrı tanımlı olmadığı için bu APK **demo modunda** derlendi — gerçek sunucuya bağlanmaz."
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.artifact.outputs.name }}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "$NOTES"
