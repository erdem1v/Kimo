# CI — bu depodaki İLK otomatik kalite kapısı.
#
# Neden var: yüzlerce pgTAP iddiası yazıldı ama geliştirme makinesinde çalıştırılamadı
# (Docker/Supabase CLI/Flutter kurulu değil). CI koşucularında Docker var, yani
# testler burada gerçekten çalışıyor. "Yazıldı ama çalıştırılmadı" durumundan
# çıkmanın en ucuz yolu bu.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ------------------------------------------------------------------ veritabanı
  db:
    name: pgTAP (şema + yetkiler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SÜRÜM SABİT (Task 14 · K8). `version: latest` en son sürümü GitHub
      # API'sinden çözüyor ve bu turda bir koşu tam da bu yüzden
      #   Failed to resolve latest Supabase CLI release: rate limit exceeded
      # ile 5 saniyede düştü — depo kodu doğruyken CI kırmızı göründü.
      # Sabitlemek hem o takılmayı hem de CLI'ın altımızdan sessizce
      # değişmesini kapatıyor. Yükseltme artık bilinçli bir commit.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # DİKKAT: `-x storage-api` ile hızlandırmayın. storage.objects şeması ve
      # trigger'ları o konteynerin kendi göçlerinden geliyor; hariç tutulursa
      # depolama testleri (030/040/050) anlamsız bir şemaya karşı çalışır.
      - name: Supabase yığınını başlat
        run: supabase start

      # Göçler + seed.sql (pgTAP eklentisi ve tests.* yardımcıları).
      #
      # `skipped` KONTROLÜ KRİTİK: Supabase CLI, adı `<14 haneli zaman
      # damgası>_ad.sql` biçimine uymayan göçleri sessizce atlar ve YİNE DE 0
      # çıkış kodu döndürür. O durumda testler boş bir veritabanına karşı
      # çalışır ve yeşil yanar — yani hiçbir şey kanıtlamaz.
      - name: Veritabanını kur (ve atlanan göç olmadığını doğrula)
        run: |
          set -o pipefail
          supabase db reset 2>&1 | tee reset.log
          if grep -qi 'skipped' reset.log; then
            echo "::error::Bazı göçler ATLANDI — dosya adları zaman damgası biçiminde olmalı."
            grep -i 'skipped' reset.log
            exit 1
          fi

      - name: pgTAP süiti
        run: supabase test db

      # Yeşil bir süit tek başına yeterli değil: hem düzeltilmiş hem
      # düzeltilmemiş şemada yeşil yanan bir test yalnızca "hata vermiyor"u
      # kanıtlar. Bu adım her korumayı tek tek bozup ilgili testin KIRMIZIYA
      # döndüğünü doğruluyor — yani testlerin gerçekten ayırt ettiğini.
      - name: Mutasyon kontrolü (testler ayırt ediyor mu?)
        run: bash tools/mutation_check.sh

      # ------------------------------------------------------- entegrasyon ağı
      # NEDEN BU İŞİN İÇİNDE: yığın zaten ayakta. Ayrı bir işte `supabase start`
      # bedelini ikinci kez ödemek, aynı testleri iki dakika geç koşturmaktan
      # başka bir şey getirmezdi.
      #
      # NEDEN VAR: Task 15 ve 16'nın iki bloke edicisi de istemci/sunucu
      # sınırının iki yakasında bir SIRA hatasıydı. pgTAP şemayı tek başına
      # doğruluyor, `flutter test` istemciyi tek başına; aradaki boşlukta
      # "yeni kullanıcı ilk sorusunu kaydedemiyor" aylarca yaşayabildi.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # `supabase status -o env` API_URL / ANON_KEY / SERVICE_ROLE_KEY veriyor.
      # Adlar depoya özgü öneklerle aktarılıyor ki testler yanlışlıkla ÜRETİM
      # değişkenlerini yakalayamasın.
      - name: Yerel yığının adresini ve anahtarlarını aktar
        run: |
          set -o pipefail
          supabase status -o env > .e2e.env
          {
            echo "SUPABASE_E2E_URL=$(grep -E '^API_URL=' .e2e.env | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_E2E_ANON_KEY=$(grep -E '^ANON_KEY=' .e2e.env | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_E2E_SERVICE_ROLE_KEY=$(grep -E '^SERVICE_ROLE_KEY=' .e2e.env | cut -d= -f2- | tr -d '\"')"
          } >> "$GITHUB_ENV"
          rm -f .e2e.env

      # SÜİT ATLANAMAZ. `--reporter expanded` ile kaç testin koştuğu görünür;
      # sıfır test koşan bir süit de yeşil yanar ve hiçbir şey kanıtlamaz —
      # yukarıdaki "atlanan göç" kontrolüyle aynı gerekçe.
      - name: Entegrasyon süiti (gerçek Supabase'e karşı)
        run: flutter test test_e2e/ --reporter expanded

  # ------------------------------------------------------------ statik kontrol
  # Flutter işinden ÖNCE ve ondan bağımsız koşar: saniyeler sürüyor ve
  # derleyicinin yakalayacağı hataların çoğunu (var olmayan token/ikon/enum
  # değeri, kullanılmayan/kırık import, dengesiz göç dosyası) SDK indirmeden
  # yakalıyor. Geliştirme makinesinde Flutter yok; bu betikler oradaki tek
  # geri bildirim yolu, CI'da da koşmaları gerekiyor ki bayatlamasınlar.
  static:
    name: statik kontroller
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # İŞ AKIŞI DOSYALARININ KENDİSİ. Bu kapı Task 13'te eklendi çünkü
      # `ci.yml` Task 10'un 5feeb02 commit'inde GEÇERSİZ YAML hâline geldi
      # (`- name: "Sınırsız" vaadi …` — çift tırnakla başlayan skalerden sonra
      # düz metin). Bozuk bir iş akışını GitHub HİÇ KOŞTURMAZ, yani pgTAP,
      # mutasyon, statik kapılar ve `flutter test` Task 10'dan Task 13'e kadar
      # HİÇ ÇALIŞMADI — Task 12'nin yedi kırık noktasının fark edilmeden
      # commit'e hazır hâle gelmesinin sebebi de bu.
      #
      # TAVUK-YUMURTA: bozuk bir ci.yml kendi içindeki bu adımı da
      # koşturamaz. Betiğin ASIL yeri geliştirme makinesi; buradaki kopya
      # yalnızca dosya ZATEN geçerliyken bir SONRAKİ bozulmayı yakalıyor.
      - name: PyYAML
        run: pip install --quiet pyyaml

      # EDGE FONKSİYONLARININ SAF PARÇALARI. Depoda iki Deno testi vardı
      # (`ad-reward/ssv.ts`in DER ayrıştırıcısı) ve HİÇBİR YERDE
      # KOŞMUYORLARDI — yazılmış ama çalıştırılmamış testin bu depodaki ikinci
      # örneği. Task 17'de abonelik mutabakatının karar fonksiyonu da buraya
      # eklendi. Bunlar ağa çıkmıyor, `supabase start` gerektirmiyor; en ucuz
      # işe, statik kapıların yanına bindiriliyor.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge fonksiyonu birim testleri
        run: deno test supabase/functions/

      - name: İş akışı denetleyicisinin kendi sınaması
        run: python tools/check_workflows.py --selftest

      - name: İş akışı dosyaları ayrıştırılabiliyor mu
        run: python tools/check_workflows.py

      # Denetleyicinin kendisi sessizce hiçbir şey bulmama hatasına düşmüştü;
      # selftest bunu her koşuda kanıtlıyor.
      - name: Sembol denetleyicisinin kendi sınaması
        run: python tools/check_symbols.py --selftest

      - name: Tasarım token'ı / kit sembolleri
        run: python tools/check_symbols.py

      # Import denetleyicisinin regex'i de bir kez sessizce bozulmuştu
      # (kaçış karakteri yerine 0x08). Selftest bunu her koşuda kanıtlıyor.
      - name: Import denetleyicisinin kendi sınaması
        run: python tools/check_imports.py --selftest

      - name: Import'lar
        run: python tools/check_imports.py

      # Task 14'te bu denetleyicinin 6. kontrolü YEŞİL dönerken göç CI'da
      # patladı: ortaya sütun eklemeyi yakalıyordu ama düzeltmenin bağımlı bir
      # görünümü düşürdüğünü göremiyordu. 8. kontrol o kör noktayı kapatıyor;
      # kendi sınaması da her koşuda ikisinin de gerçekten ayırt ettiğini
      # kanıtlıyor — depodaki diğer dört denetleyicinin zaten yaptığı gibi.
      - name: SQL denetleyicisinin kendi sınaması
        run: python tools/check_sql.py --selftest

      - name: SQL göçleri ve pgTAP plan sayıları
        run: python tools/check_sql.py

      # Konu ağacının tek kaynağı `taxonomy/yks-konulari.md`; SQL tohumu ve
      # istemci varlığı ondan ÜRETİLİYOR. Üreticinin kendi sınaması, bu depoda
      # bir denetleyicinin sessizce hiçbir şey bulmama hatasına düşmüş
      # olmasından ders: bozuk girdiyi gerçekten yakaladığını her koşuda
      # kanıtlıyor.
      - name: Taksonomi üreticisinin kendi sınaması
        run: python3 tools/build_taxonomy.py --selftest

      # Üretilen dosyalar kaynakla eş mi (pubspec.lock kapısının aynısı).
      # Kaynağı düzenleyip üreticiyi çalıştırmayı unutmak, veritabanı ile
      # istemcinin farklı ağaç görmesi demek.
      - name: Taksonomi çıktıları güncel mi
        run: python3 tools/build_taxonomy.py --check

      # Uygulama adı "Kimo" olarak kesinleşti (mağazada "Kimo: AI YKS").
      # Eski ad üç ayrı biçimde geçiyordu (boşluklu, alt tireli ve camelCase)
      # ve bir tanesini atlamak sessiz bir tutarsızlık bırakır — hukuki
      # metinlerde B-12 olarak zaten bir uyumluluk bulgusuydu.
      #
      # NOT: ne bu yorum ne de desenin kendisi eski adı LİTERAL yazıyor —
      # yazsaydı kapı kendi satırını yakalar ve muafiyet listesi şişerdi.
      # Ayırıcı isteğe bağlı (`[ _-]?`) olduğu için tek desen üç varyantı da
      # kapsıyor; ayrı bir "bitişik" alternatifi gereksiz ve o alternatif
      # literal olacağı için kendi kendini yakalardı.
      #
      # İKİ MUAFİYET, ikisi de bilinçli:
      #   • docs/task-*.md — tarihli çalışma raporları. Geçmişi yeniden
      #     yazmak yanlış olur; o belgeler o günün gerçeğini anlatıyor.
      #   • supabase/migrations/ — UYGULANMIŞ göçler. `send_push` üç kez
      #     `create or replace` edildi; eski gövdeler geçmişte eski adı
      #     yazıyor ve grep hangisinin YÜRÜRLÜKTE olduğunu bilemez. O soru
      #     `supabase/tests/240_persona.sql` içinde katalogdan soruluyor:
      #     canlı fonksiyon gövdelerinde eski ad geçmiyor.
      - name: Eski uygulama adı kalmamış mı
        run: |
          if git grep -n -i -E "ai[ _-]?yks[ _-]?coach" \
               -- . ':!docs/task-*.md' ':!supabase/migrations/*.sql'; then
            echo "::error::Eski uygulama adı hâlâ geçiyor (yukarıdaki satırlar)."
            exit 1
          fi

      # Task 10 — ÜÇ YENİ KAPI. Üçü de ilk koşuda YEŞİL başlıyor: sonradan
      # yeşile getirilmesi gereken bir kapı yok.

      # "Can" metaforu kalktı (kayan pencerede hak zamanla geri geliyor, yani
      # tükenen bir yaşam değil). Kalp ikonu tarafı `check_symbols.py` ile
      # zaten kapılı: `KimoIcons.heart` SİLİNDİĞİ için ona yapılan her başvuru
      # "yok" diye düşüyor. Kalan risk kelimenin METNE geri sızması.
      #
      # KAPSAM YALNIZCA ARB, bilinçli: bildirim metinleri veritabanında
      # yaşıyor ve orada "canım" bir SEVGİ SÖZÜ olarak 13 kez meşru biçimde
      # geçiyor (persona satırları). Desen onu hariç tutuyor; kapı bir
      # sınıflandırıcı değil, bir tel.
      # ---------------------------------------------------- Task 10 kapıları
      # DİKKAT — `git grep -E` KELİME SINIRI (`\b`) DESTEKLEMİYOR. POSIX ERE'de
      # `\b` tanımsız ve `git grep -E "\bcan\b"` SIFIR eşleşme döndürüyor, yani
      # kapı sessizce yeşil yanıyor. Bu tam olarak bu depoda İKİ KEZ yaşanan
      # hata sınıfı (check_symbols.py'nin düşen `\b`'si, check_imports.py'nin
      # 0x08 kazası) ve bu kapı yazılırken ÜÇÜNCÜ kez yaşandı.
      #
      # Çözüm iki parçalı: `git grep` yalnızca ALT DİZE arıyor (izlenen
      # dosyalarla sınırlı kalmak için), kelime sınırı işini GERÇEK grep
      # yapıyor. Sınır sınıflarında `_` da var: `can_read_mistake_photo` gibi
      # kod tanımlayıcıları yanlış alarm üretmesin.
      #
      # Kapı KENDİNİ SINIYOR: uydurma bir ihlali yakalayamazsa iş kırmızı döner.
      # Sınama GEÇİCİ BİR KOPYA üzerinde çalışıyor — gerçek dosyaya dokunup
      # `git checkout` ile geri almak, dosyada işlenmemiş değişiklik varsa onları
      # siler (yazarken tam bu oldu).
      - name: Eski kalp/yaşam metaforu arayüz metinlerine geri dönmemiş mi
        run: |
          ARB=lib/l10n/app_tr.arb
          BOUND='(^|[^a-zA-Z_])can(ı|ın|ınız|lar|ları|ların)?([^a-zA-Z_çğıöşüÇĞİÖŞÜ]|$)'
          SEVGI='(^|[^a-zA-Z_])canım([^a-zA-Z_çğıöşüÇĞİÖŞÜ]|$)'

          # 1) KAPININ KENDİ SINAMASI (geçici kopya, gerçek dosyaya dokunmuyor)
          TMP="$(mktemp)"
          cp "$ARB" "$TMP"
          printf '\n  "uydurmaIhlal": "3 canın kaldı",\n' >> "$TMP"
          if ! grep -inE "$BOUND" "$TMP" | grep -viE "$SEVGI" >/dev/null; then
            rm -f "$TMP"
            echo "::error::KAPI BOZUK — uydurma ihlali YAKALAMADI. Deseni düzeltin."
            exit 1
          fi
          rm -f "$TMP"
          echo "::notice::Kapı çalışıyor — uydurma ihlal yakalandı."

          # 2) GERÇEK KONTROL. Bildirim metinleri veritabanında yaşıyor ve orada
          #    "canım" bir SEVGİ SÖZÜ olarak 13 kez meşru biçimde geçiyor
          #    (persona satırları); kapsam bu yüzden yalnızca ARB.
          if git grep -n -i -e can -- "$ARB" | grep -iE "$BOUND" | grep -viE "$SEVGI"; then
            echo "::error::Analiz hakkı eski kalp/yaşam kelimesiyle adlandırılamaz (Task 10)."
            exit 1
          fi

      # BAŞLIK TEK TIRNAKLA SARILI. Task 10 bunu `- name: "Sınırsız" vaadi …`
      # olarak yazmıştı: YAML'de çift tırnakla BAŞLAYAN bir skalerden sonra
      # düz metin gelemez. Sonuç, bu dosyanın 5feeb02'den beri
      # AYRIŞTIRILAMAMASI — yani pgTAP, mutasyon, statik kapılar ve
      # `flutter test` Task 10'dan bu yana HİÇ KOŞMADI. Task 12'nin yedi
      # kırık noktasının fark edilmeden commit'e hazır hâle gelmesinin
      # sebebi de bu.
      - name: '"Sınırsız" vaadi kullanıcıya verilmemiş mi'
        run: |
          if git grep -n -i "sınırsız" -- lib/l10n/app_tr.arb; then
            echo "::error::Plus'ın da tavanı var; 'sınırsız' kullanıcıya söylenemez."
            exit 1
          fi

      # Apple 3.1.2 ve Play abonelik politikası gösterilen fiyatın MAĞAZANIN
      # yerelleştirilmiş fiyatı olmasını şart koşuyor.
      #
      # KAPI TASK 13'TE SERTLEŞTİ. Eskiden yer tutucu fiyatlar tek bir dosyada
      # TOPLANIYORDU (`plus_plans.dart` muaftı) ve o dosya `1.200`/`150` TL
      # değerlerini hem paywall'da hem HAK DUVARINDA canlı çizdiriyordu —
      # yani kapı sızmayı engelliyordu ama yayın engelini engellemiyordu.
      # Artık fiyatın tek kaynağı mağaza yanıtı (`PurchaseService.products`),
      # dolayısıyla MUAFİYET KALKTI: lib/ içinde hiçbir dosyada sabit para
      # birimi yazamaz.
      #
      # Desen kendi satırını yakalamasın diye para birimi LİTERAL yazılmıyor;
      # kabuk onu bir ondalık koddan üretiyor (`can` kapısının aynı kaygısı).
      # ICU KAÇIŞI YALNIZCA YER TUTUCULU İLETİDE ÇÖZÜLÜYOR. `intl`, bir iletiyi
      # ancak `{placeholder}` içeriyorsa ICU olarak ayrıştırıyor ve `''`yi tek
      # kesmeye indiriyor. Yer tutucusuz bir iletide `''` OLDUĞU GİBİ çiziliyor:
      # paywall'da "Çoklu çekim Plus''ta" yazıyordu ve bunu ancak Task 14'te
      # simülatörde gözle görebildik — derleyici de testler de sessizdi.
      - name: ARB'de çözülmemiş ICU kaçışı var mı
        run: |
          python3 - <<'PY'
          import io, json, sys
          d = json.load(io.open('lib/l10n/app_tr.arb', encoding='utf-8'))
          bad = [k for k, v in d.items()
                 if not k.startswith('@') and isinstance(v, str)
                 and "''" in v and '{' not in v]
          if bad:
              print('::error::yer tutucusuz iletide çözülmeyecek ICU kaçışı: %s' % bad)
              sys.exit(1)
          print('ARB: çözülmemiş ICU kaçışı yok')
          PY

      - name: Sabit fiyat hiçbir yerde yok mu
        run: |
          TL="$(printf '\u20ba')"
          # KAPININ KENDİ SINAMASI: uydurma bir ihlali yakalayamazsa iş kırmızı.
          TMP="$(mktemp)"
          printf 'const x = "%s150";\n' "$TL" > "$TMP"
          if ! grep -q "$TL" "$TMP"; then
            rm -f "$TMP"
            echo "::error::KAPI BOZUK — para birimi deseni üretilemedi."
            exit 1
          fi
          rm -f "$TMP"
          if git grep -n -F "$TL" -- lib/; then
            echo "::error::Fiyat MAĞAZADAN gelmeli; lib/ içinde sabit fiyat olamaz."
            exit 1
          fi

  # ---------------------------------------------------------------------- Dart
  flutter:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # pubspec.lock depoya işleniyor ve pubspec.yaml ile eşzamanlı kalmalı.
      # `pub get` kilidi her çalıştığında yeniden yazar; bir sapma varsa (sürüm
      # çözümü değişmiş ya da bir bağımlılığın `dependency:` türü kaymışsa)
      # burada görülür ve iş kırmızıya döner.
      - name: pubspec.lock değişmedi mi
        run: git diff --exit-code pubspec.lock

      - run: flutter analyze

      - run: flutter test

  # ------------------------------------------------------------------ Android
  #
  # NEDEN AYRI BİR İŞ: geliştirme makinesinde Android SDK YOK, yani Android
  # tarafı bu depoda hiçbir zaman DERLENMEDİ — manifest, kaynak bağları
  # (uyarlanabilir ikon XML'i, açılış görseli, renk kaynağı), R8 kuralları ve
  # eklenti yüzeyi yalnızca okunarak doğrulanıyordu. Mağazaya gidecek iki
  # yapıdan birinin hiç derlenmemiş olması, bu turda kapatılan en sessiz
  # boşluklardan biri.
  #
  # `--release` BİLEREK: küçültme (R8) ve kaynak budama YALNIZCA burada
  # çalışıyor ve eklentilerin bilinen R8 kırılmaları (flutter_local_
  # notifications'ın Gson serileştirmesi) ancak bu yapıda görünür.
  # `key.properties` CI'da yok; yapı DEBUG anahtarıyla imzalanıyor ve bu
  # derleme günlüğüne yazılıyor — Play'e yüklenemez, doğrulama için yeterli.
  android:
    name: Android derlemesi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release
