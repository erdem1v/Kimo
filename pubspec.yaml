name: kimo
description: "Kimo — YKS hata arşivi ve aralıklı tekrar uygulaması"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  confetti: ^0.8.0
  audioplayers: ^6.8.1
  image_picker: ^1.2.3
  supabase_flutter: ^2.16.0
  # Çevrimdışı cevap kuyruğu ve cihaz tercihleri için
  # (bkz. lib/data/submission_queue.dart, lib/state/app_settings.dart).
  # supabase_flutter üzerinden zaten geçişli olarak geliyordu; buraya alınması
  # sürümü değiştirmiyor ama pubspec.lock'taki `dependency` alanını
  # `transitive` -> `"direct main"` yapıyor. O satır da güncellendi.
  shared_preferences: ^2.5.5
  # Çevrimdışı FOTOĞRAF kuyruğunun bayt deposu (bkz. lib/data/photo_queue.dart).
  # Cevap kuyruğu üstverisini shared_preferences'ta tutuyor; fotoğraf için aynı
  # yol yanlış olurdu — base64'e çevrilmiş bir JPEG megabaytlarca METİN demek ve
  # prefs her yazımda dosyanın tamamını yeniden serileştiriyor. Baytlar
  # uygulamanın belge dizinine dosya olarak yazılıyor, üstveri prefs'te kalıyor.
  # Paket zaten GEÇİŞLİ olarak geliyordu; buraya alınması sürümü değiştirmiyor,
  # yalnızca pubspec.lock'taki `dependency` alanı `transitive` -> `direct main`
  # oluyor.
  path_provider: ^2.1.5
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  app_settings: ^9.0.0
  sentry_flutter: ^9.29.0
  # Hukuki metin bağlantıları ve yaptırım itirazının destek adresi (Task 07).
  # Kullanım koşulları / gizlilik politikası bağlantısı mağaza şartı
  # (Apple 1.2; ASC ve Play Console'da zorunlu alan) ve uygulama içinden bir
  # URL açmanın başka yolu yok. `shared_preferences` ile aynı durum: paket
  # zaten GEÇİŞLİ olarak geliyordu, buraya alınması sürümü değiştirmiyor —
  # yalnızca pubspec.lock'taki `dependency` alanı `transitive` -> `direct main`
  # oluyor. O satır da güncellendi.
  url_launcher: ^6.3.2
  # Odullu reklam (Task 10). Tek reklam bicimi var: kullanici ISTEYEREK izliyor
  # ve karsiliginda bir analiz hakki kazaniyor. Interstitial, banner ve acilis
  # reklami YOK ve eklenmeyecek.
  #
  # NEDEN AdMob: tek entegrasyonla iki platform, ve sunucu tarafi dogrulama
  # (SSV) yerlesik. SSV bu ozelligin kilit sarti — odul istemcinin "izledim"
  # demesiyle degil, Google'in sunucusundan gelen ECDSA imzali bir geri
  # cagriyla veriliyor (bkz. supabase/functions/ad-reward). Diger aglarda S2S
  # geri cagri ya yok ya mediation katmanina bagli.
  #
  # GECISLI OLARAK UC YERLI EKLENTI GETIRIYOR: webview_flutter,
  # webview_flutter_android, webview_flutter_wkwebview. docs/hukuki-metinler.md
  # §1.11'deki "istemciden Supabase, Firebase ve Sentry disinda hicbir dis HTTP
  # cikisi yok" iddiasi bu yuzden de yeniden yazildi.
  #
  # WEB DESTEGI YOK. Bu depoda `web/` var; reklam servisi kIsWeb'de hicbir sey
  # yapmadan "reklam yok" donuyor (bkz. lib/services/ads/ad_service.dart).
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # gen_l10n: lib/l10n/app_tr.arb -> AppLocalizations (bkz. l10n.yaml).
  generate: true
  assets:
    - assets/sounds/
    # Konu agacinin GOMULU YEDEGI (Task 09). Uretilen dosya; kaynagi
    # taxonomy/yks-konulari.md, ureticisi tools/build_taxonomy.py.
    #
    # Neden gomulu: agacin tek calisma zamani kaynagi veritabani, ama ilk
    # acilista ve cevrimdisiyken konu secilemezse SORU KAYDEDILEMEZ. Yedek
    # olmadan uygulamanin cekirdek akisi aga bagimli hale gelirdi.
    - assets/curriculum/tree.json
  # Yazı tipleri depoya gömüldü: çalışma anında indirme yok (düşük donanımlı
  # Android ve çevrimdışı ilk açılış için). Google Fonts'tan latin+latin-ext
  # altkümesi alındı; 12 Türkçe glifin hepsi her ağırlıkta doğrulandı.
  fonts:
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-500.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-600.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-700.ttf
          weight: 700
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-400.ttf
          weight: 400
        - asset: assets/fonts/DMSans-500.ttf
          weight: 500
        - asset: assets/fonts/DMSans-600.ttf
          weight: 600
        - asset: assets/fonts/DMSans-700.ttf
          weight: 700
